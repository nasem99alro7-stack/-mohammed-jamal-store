<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوريا أوتو | لوحة التحكم</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap" style="padding:50px 0"><span class="eyebrow">SYRIA AUTO ADMIN</span><h1>لوحة التحكم</h1><p>هذه نسخة تشغيل أولية لإدارة الكتالوج. ربط قاعدة البيانات والموردين يتم في مرحلة الإنتاج.</p><div class="products" id="admin"></div><a class="secondary" href="index.html">← العودة للمتجر</a></main><script src="app.js"></script><script>document.getElementById('admin').innerHTML=products.map(p=>`<article class="card"><div class="photo"><span>${p.icon}</span></div><div class="cardBody"><span class="cat">${p.cat}</span><h3>${p.name}</h3><b>${money(p.price)}</b><p>المخزون: ${p.stock}</p><button class="add" onclick="alert('جاهز للربط بقاعدة البيانات: ${p.name}')">تعديل المنتج</button></div></article>`).join('')</script></body></html>
