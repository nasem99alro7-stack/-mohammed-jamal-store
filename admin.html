<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم — سوريا أونلاين</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4faf5;color:#17221a;font-family:Arial,Tahoma,sans-serif}
header{background:#fff;border-bottom:1px solid #dfe9e1;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:800}.brand span{color:#39a548}.wrap{max-width:1200px;margin:auto;padding:22px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:1px solid #d7e2d9;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
button.active,button.primary{background:#39a548;color:#fff;border-color:#39a548}.danger{color:#b42323}
.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e0e9e1;border-radius:14px;padding:18px}.card small{color:#6c786f}.card b{display:block;font-size:25px;margin-top:7px}
.panel{background:#fff;border:1px solid #e0e9e1;border-radius:14px;padding:18px;margin-top:16px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 8px;border-bottom:1px solid #edf2ee;text-align:right;font-size:13px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label{font-size:13px;font-weight:700}.form .full{grid-column:1/-1}
input,select,textarea{width:100%;margin-top:6px;padding:10px;border:1px solid #d7e2d9;border-radius:9px;font:inherit}textarea{min-height:90px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}.wrap{padding:14px}}
</style>
</head>
<body>
<header><div class="brand">سوريا <span>أونلاين</span> — لوحة التحكم</div><button onclick="location.href='index.html'">↗ المتجر</button></header>
<div class="wrap">
<nav>
<button class="active" data-v="dash">📊 الرئيسية</button>
<button data-v="products">🛍️ المنتجات</button>
<button data-v="orders">📦 الطلبات</button>
<button data-v="categories">🗂️ الأقسام</button>
</nav>

<section id="dash" class="view active">
<div class="cards">
<div class="card"><small>المنتجات</small><b id="nProducts">0</b></div>
<div class="card"><small>الطلبات</small><b id="nOrders">0</b></div>
<div class="card"><small>المبيعات</small><b id="sales">0</b></div>
<div class="card"><small>المخزون المنخفض</small><b id="low">0</b></div>
</div>
<div class="panel"><h3>آخر الطلبات</h3><div id="recent"></div></div>
</section>

<section id="products" class="view">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
<h2>المنتجات</h2><button class="primary" onclick="openProduct()">＋ إضافة منتج</button>
</div>
<div class="panel"><table><thead><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead><tbody id="productsTable"></tbody></table></div>
</section>

<section id="orders" class="view">
<h2>الطلبات</h2>
<div class="panel"><table><thead><tr><th>الطلب</th><th>العميل</th><th>المجموع</th><th>الحالة</th><th></th></tr></thead><tbody id="ordersTable"></tbody></table></div>
</section>

<section id="categories" class="view">
<h2>الأقسام</h2><div class="panel" id="cats"></div>
</section>
</div>

<div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="modalTitle">إضافة منتج</h2><button onclick="closeModal()">×</button></div>
<form id="productForm"><div class="form">
<label>اسم المنتج<input id="pName" required></label>
<label>القسم<input id="pCat" required></label>
<label>السعر<input id="pPrice" type="number" min="0" required></label>
<label>السعر القديم<input id="pOld" type="number" min="0"></label>
<label>المخزون<input id="pStock" type="number" min="0" required></label>
<label>الإيموجي<input id="pEmoji" value="🛍️"></label>
<label class="full">الوصف<textarea id="pDesc"></textarea></label>
</div><div class="actions"><button type="button" onclick="closeModal()">إلغاء</button><button class="primary">حفظ المنتج</button></div></form>
</div></div>

<script>
const PKEY='so_admin_products_v1', OKEY='so_orders_v6';
let products=load(PKEY,[]), orders=load(OKEY,[]), editId=null;
function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}
function save(){localStorage.setItem(PKEY,JSON.stringify(products))}
function money(n){return new Intl.NumberFormat('ar-SY').format(Number(n)||0)+' ل.س'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
document.getElementById('nProducts').textContent=products.length;
document.getElementById('nOrders').textContent=orders.length;
document.getElementById('sales').textContent=money(orders.reduce((a,o)=>a+Number(o.total||o.amount||0),0));
document.getElementById('low').textContent=products.filter(p=>Number(p.stock||0)<5).length;
document.getElementById('productsTable').innerHTML=products.map(p=>`<tr><td>${esc(p.emoji||'🛍️')} ${esc(p.name)}</td><td>${esc(p.cat||'—')}</td><td>${money(p.price)}</td><td>${p.stock??0}</td><td>${p.active===false?'متوقف':'نشط'}</td><td><button onclick="editProduct(${p.id})">تعديل</button> <button class="danger" onclick="delProduct(${p.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد منتجات</td></tr>';
document.getElementById('ordersTable').innerHTML=orders.map((o,i)=>`<tr><td>${esc(o.id||('#'+(i+1)))}</td><td>${esc(o.customer?.name||o.name||'—')}</td><td>${money(o.total||o.amount)}</td><td>${esc(o.status||'جديد')}</td><td><button onclick="statusOrder(${i})">تغيير الحالة</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد طلبات</td></tr>';
document.getElementById('recent').innerHTML=orders.slice(-5).reverse().map((o,i)=>`<div style="padding:9px 0;border-bottom:1px solid #eee">${esc(o.id||'طلب')} — ${esc(o.customer?.name||o.name||'عميل')} — ${money(o.total||o.amount)}</div>`).join('')||'لا توجد طلبات بعد.';
const cs=[...new Set(products.map(p=>p.cat).filter(Boolean))];
document.getElementById('cats').innerHTML=cs.map(c=>`<button style="margin:5px">${esc(c)}</button>`).join('')||'لا توجد أقسام.';
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.v).classList.add('active')});
function openProduct(id=null){editId=id;let p=products.find(x=>x.id===id)||{};modal.classList.add('show');modalTitle.textContent=id?'تعديل منتج':'إضافة منتج';pName.value=p.name||'';pCat.value=p.cat||'';pPrice.value=p.price??'';pOld.value=p.old??'';pStock.value=p.stock??0;pEmoji.value=p.emoji||'🛍️';pDesc.value=p.description||''}
function editProduct(id){openProduct(id)}
function closeModal(){modal.classList.remove('show')}
productForm.onsubmit=e=>{e.preventDefault();let p={id:editId||Date.now(),name:pName.value,cat:pCat.value,price:Number(pPrice.value),old:Number(pOld.value)||0,stock:Number(pStock.value)||0,emoji:pEmoji.value||'🛍️',description:pDesc.value,active:true};if(editId)products=products.map(x=>x.id===editId?p:x);else products.push(p);save();render();closeModal()}
function delProduct(id){if(confirm('حذف المنتج؟')){products=products.filter(p=>p.id!==id);save();render()}}
function statusOrder(i){let s=prompt('اكتب الحالة: جديد / قيد التجهيز / تم الشحن / تم التسليم / ملغي',orders[i].status||'جديد');if(s){orders[i].status=s;localStorage.setItem(OKEY,JSON.stringify(orders));render()}}
render();
</script>
</body>
</html>
